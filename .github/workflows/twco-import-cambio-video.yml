name: Importar vídeo de câmbio TWCO (uso único)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/twco-import-cambio-video.yml"
permissions:
  contents: write
jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Download authorized video assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --silent --show-error             "https://sb-qd0dmfu145s2.vercel.run/cambio-fluidos.mp4" -o media/cambio-fluidos.mp4
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 --silent --show-error             "https://sb-qd0dmfu145s2.vercel.run/cambio-fluidos-card.mp4" -o media/cambio-fluidos-card.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 media/cambio-fluidos.mp4
          test "$(stat -c%s media/cambio-fluidos.mp4)" -gt 1000000
          test "$(stat -c%s media/cambio-fluidos-card.mp4)" -gt 100000
      - name: Commit only the video files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/cambio-fluidos.mp4 media/cambio-fluidos-card.mp4
          git diff --cached --quiet || git commit -m "TWCO: adicionar vídeo de câmbio otimizado para web"
          git push origin HEAD:main
